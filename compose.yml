services:
  abs-tidy-library:
    image: donaldwin/abs-tidy-library:latest
    container_name: abs-tidy-library
    restart: unless-stopped
    ports:
      - "5050:8080"           # Change 5050 to any free port on your host
    volumes:
      # The left side must be the same host path that your ABS compose mounts.
      # The right side can be anything — just keep it in sync with LIBRARY_PATH below.
      - /path/to/audiobooks:/library

      # A folder for persisting your naming settings between container restarts.
      # Must be a directory (not a file). Will be created automatically if it doesn't exist.
      - /path/to/config:/config

    environment:
      # ── Audiobookshelf connection ────────────────────────────────────────────
      # ABS_SERVER_URL is used for internal API calls.
      # Use your server's LAN IP — not localhost or 127.0.0.1.
      # Those won't work from inside a container even if ABS is on the same machine.
      ABS_SERVER_URL: "http://192.168.1.100:13378"

      # ABS_EXTERNAL_URL is used for deep links that open in the browser.
      # If you use a reverse proxy or custom domain (e.g. Caddy), set this to
      # the address you type in your browser. Falls back to ABS_SERVER_URL if not set.
      #
      # Example — direct access (same value for both):
      #   ABS_SERVER_URL:   "http://192.168.1.100:13378"
      #   ABS_EXTERNAL_URL: "http://192.168.1.100:13378"
      #
      # Example — behind a reverse proxy:
      #   ABS_SERVER_URL:   "http://audiobookshelf:80"   # internal container name
      #   ABS_EXTERNAL_URL: "http://abs.internal"        # what you type in your browser
      ABS_EXTERNAL_URL: "http://192.168.1.100:13378"

      # API key from ABS → Settings → API Keys → Add API Key.
      # Must be an admin account — the tool reads library metadata, edits book
      # metadata, and triggers rescans.
      ABS_TOKEN: "your-api-key-here"

      # Optional — auto-selects a library on load so you don't have to pick it manually.
      # Find it in ABS → Settings → Libraries → click your library → copy the ID from the URL.
      ABS_LIBRARY_ID: ""

      # ── Paths ────────────────────────────────────────────────────────────────
      # Must match the right side of your audiobooks volume mount above.
      LIBRARY_PATH: "/library"

      # Must match the right side of your config volume mount above.
      CONFIG_PATH: "/config/naming.json"

      # ── Naming templates (optional) ───────────────────────────────────────────
      # Configure these in the UI instead — they save automatically.
      # These are only used as a fallback if no saved config exists yet.
      #
      # Tokens: {Author} {Title} {Series} {Series-Index} {Narrator} {Year}
      #         {Subtitle} {Publisher} {Genre} {Language} {ISBN} {ASIN}
      #         {Part-Index} {Part-Total}
      #
      # NAMING_FOLDER_STANDALONE:  "{Author}/{Title}"
      # NAMING_FOLDER_SERIES:      "{Author}/{Series}/{Series-Index} {Title}"
      # NAMING_FILE_SINGLE:        "{Author} - {Title}"
      # NAMING_FILE_MULTI:         "{Author} - {Title} (Part {Part-Index} of {Part-Total})"
      # NAMING_FILE_SINGLE_SERIES: "{Author} - {Series} {Series-Index} - {Title}"
      # NAMING_FILE_MULTI_SERIES:  "{Author} - {Series} {Series-Index} - {Title} (Part {Part-Index} of {Part-Total})"
